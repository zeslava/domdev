{% extends "base.html" %}

{% block title %}#{{ term.name }} — {{ config.title }}{% endblock %}

{% block content %}
<article class="post">
  <header>
    <h1>#{{ term.name }}</h1>
  </header>
  <ul>
    {% for page in term.pages %}
    <li>
      <a href="{{ page.permalink }}">{{ page.title }}</a>
      <time>{{ page.date | date(format="%Y-%m-%d") }}</time>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
